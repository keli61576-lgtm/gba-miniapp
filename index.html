<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Player Advance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e0b16;--p1:#8a5ce0;--p2:#5a33a8;--bezel:#3a3844;--lcd:#c3cf8b;--ink:#26331c;--ink2:#56673b;--btn:#a3235a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#eee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation}
html,body{overscroll-behavior:none}
html{overflow:hidden}
body{position:fixed;inset:0;width:100%;overflow:hidden;
 padding-top:calc(env(safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
 padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px));
 padding-left:calc(env(safe-area-inset-left,0px) + var(--tg-safe-area-inset-left,0px));
 padding-right:calc(env(safe-area-inset-right,0px) + var(--tg-safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---------- console ---------- */
#home{height:100%;overflow-y:auto;overscroll-behavior:none;display:flex}
.console{width:100%;height:100%;min-height:500px;overflow:hidden;display:flex;flex-direction:column;padding:12px 16px 34px;background:linear-gradient(155deg,var(--p1),var(--p2))}
.bezel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bezel);padding:10px 14px 14px}
.bezel-top{display:flex;align-items:center;gap:6px;font-size:.6rem;letter-spacing:.12em;color:#9a98a8;margin-bottom:8px}
.bezel-top i{width:7px;height:7px;border-radius:50%;background:#e33;box-shadow:0 0 6px #e33}
.lcd{background:var(--lcd);color:var(--ink);flex:1;min-height:0;display:flex;flex-direction:column;font-family:"Courier New",monospace;box-shadow:inset 0 0 14px #0004;overflow:hidden}
.lcd-head{padding:5px 8px;border-bottom:2px solid var(--ink);font-weight:700;font-size:.8rem;letter-spacing:.08em}
#list{flex:1;min-height:0;margin:0;padding:0;list-style:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.lcd-head,.lcd-foot,.logo,.pad,.ss,.bezel-top{flex:none}
#list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px dashed #26331c55;cursor:pointer}
#list li.on{background:var(--ink);color:var(--lcd)}
.cv{flex:none;width:44px;height:44px;border:2px solid currentColor;display:grid;place-items:center;font-weight:700;font-size:1.2rem;overflow:hidden;background:#0001}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.nm{flex:1;min-width:0;font-weight:700;font-size:.85rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{font-size:.6rem;white-space:nowrap}
.empty{padding:22px 14px;text-align:center;line-height:1.6;font-size:.85rem}
.lcd-foot{display:flex;gap:4px;padding:5px;border-top:2px solid var(--ink)}
.lcd-foot button{flex:1;background:transparent;color:var(--ink);border:2px solid var(--ink);padding:5px 0;font:700 .72rem "Courier New",monospace}
.lcd-foot button:active{background:var(--ink);color:var(--lcd)}
.logo{margin:12px 6px 4px;font:italic 800 1.05rem system-ui;letter-spacing:.06em;color:#e7dcff;text-shadow:0 1px 0 #0005}
.pad{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 0}
.dpad{position:relative;width:99px;height:99px}
.dpad:before,.dpad:after{content:"";position:absolute;background:#24212c;border-radius:4px}
.dpad:before{left:33px;top:0;width:33px;height:99px}.dpad:after{left:0;top:33px;width:99px;height:33px}
.d{position:absolute;width:33px;height:33px;z-index:1;background:transparent;border:0;color:#6d6a7a;font-size:0}
.d:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0 solid transparent}
.d.u:after{border-width:0 6px 9px;border-bottom-color:currentColor}.d.dn:after{border-width:9px 6px 0;border-top-color:currentColor}
.d.l:after{border-width:6px 9px 6px 0;border-right-color:currentColor}.d.r:after{border-width:6px 0 6px 9px;border-left-color:currentColor}
.d:active{color:#fff}.d.u{left:33px;top:0}.d.dn{left:33px;top:66px}.d.l{left:0;top:33px}.d.r{left:66px;top:33px}
.ab{display:flex;gap:14px;transform:rotate(-22deg);margin-right:4px}
.ab button{width:50px;height:50px;border-radius:50%;border:0;background:var(--btn);color:#f6c8dc;font-weight:800;box-shadow:inset 0 -4px 0 #0004,0 3px 0 #0003}
.ab button:active{transform:translateY(2px)}.ab button:last-child{margin-top:-16px}
.ss{display:flex;justify-content:center;gap:22px;margin-top:20px;transform:rotate(-22deg)}
.ss button{width:54px;height:14px;border-radius:7px;border:0;background:#3a3844;box-shadow:0 2px 0 #0004}
.ss span{display:block;margin-top:5px;font-size:.55rem;letter-spacing:.1em;color:#e7dcff;text-align:center}

/* ---------- jogando (console) ---------- */
#play{display:none;height:100%}
body.playing #home{display:none}
body.playing #play{display:block}
.ejs_virtualGamepad_parent{display:none!important}
#pc{height:100%;max-width:520px;margin:0 auto;display:grid;gap:8px;padding:8px 14px 14px;background:linear-gradient(155deg,var(--p1),var(--p2));
 grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto minmax(0,1fr) auto;
 grid-template-areas:"bar bar" "l r" "lcd lcd" "d ab" "ss ss"}
.pbar{grid-area:bar;display:flex;align-items:center;gap:6px}
.pbar button{background:#2d2640;color:#e7dcff;border:0;border-radius:8px;padding:8px 10px;font-weight:600;font-size:.8rem}
#title{flex:1;min-width:0;font-size:.8rem;color:#e7dcff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pb{-webkit-user-select:none;user-select:none;touch-action:none;cursor:pointer}
.sh{height:34px;width:62%;border:0;background:#2d2640;color:#cbbcf5;font-weight:800;border-radius:12px 12px 4px 4px;box-shadow:inset 0 -3px 0 #0004}
.sh.l{grid-area:l;justify-self:start}.sh.r{grid-area:r;justify-self:end}
.sh.on,.ab2 .pb.on,.ss2 .pb.on{filter:brightness(1.5)}
.lcdwrap{grid-area:lcd;background:var(--bezel);padding:12px 14px;display:flex;justify-content:center;min-height:0}
.screen{width:100%;aspect-ratio:3/2;background:#000;position:relative;overflow:hidden}
#game{width:100%;height:100%}
.lcdwrap.big{position:fixed;inset:0;z-index:60;padding:calc(env(safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 0 calc(env(safe-area-inset-bottom,0px) + var(--tg-safe-area-inset-bottom,0px)) 0;background:#000}
.lcdwrap.big .screen{aspect-ratio:auto;height:100%}
#p-close{display:none;position:fixed;z-index:100;top:calc(8px + env(safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));right:8px;background:var(--p1);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700}
.lcdwrap.big #p-close{display:block}
.dpad2{grid-area:d;justify-self:center;align-self:center;position:relative;width:132px;height:132px;touch-action:none}
.dpad2:before,.dpad2:after{content:"";position:absolute;background:#24212c;border-radius:5px}
.dpad2:before{left:44px;top:0;width:44px;height:132px}.dpad2:after{left:0;top:44px;width:132px;height:44px}
.ar{position:absolute;z-index:1;border:0 solid transparent;color:#6d6a7a}.ar.on{color:#fff}
.ar.u{left:60px;top:10px;border-width:0 6px 10px;border-bottom-color:currentColor}.ar.bt{left:60px;bottom:10px;border-width:10px 6px 0;border-top-color:currentColor}
.ar.l{left:10px;top:60px;border-width:6px 10px 6px 0;border-right-color:currentColor}.ar.r{right:10px;top:60px;border-width:6px 0 6px 10px;border-left-color:currentColor}
.ab2{grid-area:ab;justify-self:center;align-self:center;display:flex;gap:16px;transform:rotate(-22deg)}
.ab2 .pb{width:64px;height:64px;border-radius:50%;border:0;background:var(--btn);color:#f6c8dc;font-weight:800;font-size:1.1rem;box-shadow:inset 0 -4px 0 #0004,0 3px 0 #0003}
.ab2 .pb:last-child{margin-top:-20px}
.ss2{grid-area:ss;display:flex;justify-content:center;gap:34px}
.ss2 .pb{display:block;width:58px;height:15px;border-radius:8px;border:0;background:#3a3844;box-shadow:0 2px 0 #0004}
.ss2 span{display:block;margin-top:5px;font-size:.55rem;letter-spacing:.1em;color:#e7dcff;text-align:center}
@media (orientation:landscape) and (max-height:560px){
 #pc{max-width:none;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"bar bar bar" "l lcd r" "d lcd ab" "ss ss ss"}
 .sh{width:70%}
 .lcdwrap{align-self:stretch;grid-row:2/4}
 .screen{height:100%;width:auto;max-width:100%}
 .dpad2{width:112px;height:112px}.dpad2:before{left:37px;width:38px;height:112px}.dpad2:after{top:37px;height:38px;width:112px}
 .ar.u{left:50px}.ar.bt{left:50px}.ar.l{top:50px}.ar.r{top:50px}
 .ab2 .pb{width:54px;height:54px}
}

/* ---------- janelas ---------- */
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;
 overscroll-behavior:none;touch-action:none;
 padding:calc(16px + env(safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px) + var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px))}
.ov.show{display:flex}
.card{width:min(100%,360px);background:#1d1830;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.card h2{margin:0;font-size:1.1rem}
.card label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:#bdb3d6}
.card input[type=text]{background:#120f20;border:1px solid #4b3f78;color:#fff;border-radius:8px;padding:10px;font-size:1rem}
.card input[type=file]{font-size:.8rem;color:#bdb3d6}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{background:var(--p1);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700}
.btn.sec{background:#33294f}
.slot{display:flex;align-items:center;gap:8px;background:#120f20;border-radius:10px;padding:8px 10px}
.slot b{display:block;font-size:.85rem}.slot small{color:#9b90bb}.slot div{flex:1}
.slot button{padding:8px 10px;font-size:.8rem;border-radius:8px;border:0;background:var(--p2);color:#fff}
.slot button:disabled{opacity:.35}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);background:#fff;color:#111;padding:10px 16px;border-radius:20px;font-size:.85rem;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<main id="home">
 <div class="console">
  <div class="bezel">
   <div class="bezel-top"><i></i>BATERIA</div>
   <div class="lcd">
    <div class="lcd-head">MEUS JOGOS</div>
    <ul id="list"></ul>
    <div class="lcd-foot" id="foot">
     <button id="b-play">Jogar</button><button id="b-new">Do zero</button><button id="b-cover">Capa</button><button id="b-del">Apagar</button>
    </div>
   </div>
  </div>
  <div class="logo">GAME BOY ADVANCE</div>
  <div class="pad">
   <div class="dpad">
    <button class="d u" data-k="up" aria-label="Cima"></button><button class="d l" data-k="left" aria-label="Esquerda"></button>
    <button class="d r" data-k="right" aria-label="Direita"></button><button class="d dn" data-k="down" aria-label="Baixo"></button>
   </div>
   <div class="ab"><button data-k="b" aria-label="B">B</button><button data-k="a" aria-label="A, jogar">A</button></div>
  </div>
  <div class="ss">
   <div><button data-k="select" aria-label="Select, trocar capa"></button><span>SELECT</span></div>
   <div><button data-k="start" aria-label="Start, adicionar jogo"></button><span>START</span></div>
  </div>
 </div>
</main>

<section id="play"><div id="pc">
 <div class="pbar"><button id="p-back">← Jogos</button><div id="title"></div><button id="p-saves">Saves</button><button id="p-set">Ajustes</button></div>
 <button class="pb sh l" data-i="10" aria-label="L">L</button>
 <button class="pb sh r" data-i="11" aria-label="R">R</button>
 <div class="lcdwrap" id="lcdwrap"><div class="screen"><div id="game"></div></div><button id="p-close">✕ Fechar ajustes</button></div>
 <div class="dpad2" id="dp"><i class="ar u"></i><i class="ar bt"></i><i class="ar l"></i><i class="ar r"></i></div>
 <div class="ab2"><button class="pb" data-i="0" aria-label="B">B</button><button class="pb" data-i="8" aria-label="A">A</button></div>
 <div class="ss2"><div><button class="pb" data-i="2" aria-label="Select"></button><span>SELECT</span></div><div><button class="pb" data-i="3" aria-label="Start"></button><span>START</span></div></div>
</div></section>

<div class="ov" id="ov-add"><div class="card">
 <h2>Adicionar jogo</h2>
 <label>Nome<input type="text" id="f-name" maxlength="60" placeholder="Ex.: Pokémon Emerald"></label>
 <label>ROM (.gba, .zip ou .7z)<input type="file" id="f-rom"></label>
 <label>Capa (opcional)<input type="file" id="f-cover" accept="image/*"></label>
 <div class="row"><button class="btn sec" id="a-cancel">Cancelar</button><button class="btn" id="a-ok">Adicionar</button></div>
</div></div>

<div class="ov" id="ov-saves"><div class="card">
 <h2>Saves</h2>
 <p style="margin:0;font-size:.8rem;color:#9b90bb">O auto-save grava a cada 30 s e ao sair do jogo.</p>
 <div id="slots"></div>
 <button class="btn sec" id="s-vib"></button>
 <button class="btn sec" id="s-close">Fechar</button>
</div></div>

<input type="file" id="f-cover2" accept="image/*" hidden>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const tg=window.Telegram&&window.Telegram.WebApp;
try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();tg.setHeaderColor('#0e0b16');tg.setBackgroundColor('#0e0b16')}catch(e){}
try{navigator.storage.persist()}catch(e){}
document.addEventListener('touchmove',e=>{if(!e.target.closest('#list,.card,#game'))e.preventDefault()},{passive:false});
addEventListener('scroll',()=>scrollTo(0,0));

let vibOn=true;try{vibOn=localStorage.getItem('vib')!=='0'}catch(e){}
function buzz(k){if(!vibOn)return;try{tg.HapticFeedback.impactOccurred(k||'light');return}catch(e){}try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&!b.classList.contains('pb'))buzz('light')},true);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400)}
const ask=m=>new Promise(r=>{try{tg.showConfirm(m,r)}catch(e){r(confirm(m))}});
const fmt=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});

/* ---------- banco local (IndexedDB) ---------- */
const db=new Promise((ok,no)=>{const r=indexedDB.open('player-advance',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('games',{keyPath:'id'});r.result.createObjectStore('states',{keyPath:'key'})};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(s,m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction(s,m);const r=f(t.objectStore(s));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};
const put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),
      del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),all=s=>tx(s,'readonly',o=>o.getAll());

/* ---------- biblioteca ---------- */
let games=[],autos=new Set(),sel=0,urls=[];
async function loadLib(){
 games=(await all('games')).sort((a,b)=>b.added-a.added);
 autos=new Set((await all('states')).filter(s=>s.key.endsWith(':auto')).map(s=>s.key.slice(0,-5)));
 if(sel>=games.length)sel=Math.max(0,games.length-1);render();
}
function render(){
 urls.forEach(URL.revokeObjectURL);urls=[];
 const ul=$('#list');ul.innerHTML='';$('#foot').style.display=games.length?'flex':'none';
 if(!games.length){ul.innerHTML='<li class="empty" style="display:block;cursor:default">Nenhum jogo ainda.<br>Aperte START para adicionar o primeiro.</li>';return}
 games.forEach((g,i)=>{
  const li=document.createElement('li');if(i===sel)li.className='on';
  const cv=document.createElement('div');cv.className='cv';
  if(g.cover){const im=new Image();im.alt='';const u=URL.createObjectURL(g.cover);urls.push(u);im.src=u;cv.appendChild(im)}else cv.textContent=(g.name[0]||'?').toUpperCase();
  const nm=document.createElement('div');nm.className='nm';nm.textContent=g.name;
  const tg2=document.createElement('div');tg2.className='tag';tg2.textContent=autos.has(g.id)?'● SALVO':'';
  li.append(cv,nm,tg2);
  li.onclick=()=>{if(sel===i)launch(g.id,false);else{sel=i;render()}};
  ul.appendChild(li);
 });
 const on=ul.querySelector('.on');on&&on.scrollIntoView({block:'nearest'});
 $('#b-new').style.display=autos.has(games[sel].id)?'':'none';
}
const cur_=()=>games[sel];
function launch(id,fresh){location.hash='play='+encodeURIComponent(id)+(fresh?'&fresh':'');location.reload()}

function openAdd(){$('#f-name').value='';$('#f-rom').value='';$('#f-cover').value='';$('#ov-add').classList.add('show')}
$('#a-cancel').onclick=()=>$('#ov-add').classList.remove('show');
$('#f-rom').onchange=e=>{const f=e.target.files[0];if(f&&!$('#f-name').value)$('#f-name').value=f.name.replace(/\.[^.]+$/,'')};
$('#a-ok').onclick=async()=>{
 const rom=$('#f-rom').files[0],cover=$('#f-cover').files[0],name=$('#f-name').value.trim();
 if(!rom||!/\.(gba|agb|zip|7z)$/i.test(rom.name))return toast('Esse arquivo não parece uma ROM de GBA (.gba, .zip ou .7z)');
 const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random()).replace(/[^\w-]/g,'');
 try{
  /* copia os bytes para a memória: guardar o File direto aponta para o arquivo no celular e depois dá ERR_FILE_NOT_FOUND */
  const romCopy=new Blob([await rom.arrayBuffer()]);
  const coverCopy=cover?new Blob([await cover.arrayBuffer()],{type:cover.type}):null;
  await put('games',{id,name:name||rom.name.replace(/\.[^.]+$/,''),rom:romCopy,cover:coverCopy,added:Date.now()})
 }catch(e){return toast('Não foi possível guardar este jogo (sem espaço ou arquivo ilegível)')}
 $('#ov-add').classList.remove('show');sel=0;await loadLib();toast('Jogo adicionado')};

$('#b-play').onclick=()=>cur_()&&launch(cur_().id,false);
$('#b-new').onclick=async()=>{const g=cur_();if(g&&await ask('Começar do zero? O auto-save será ignorado.'))launch(g.id,true)};
$('#b-cover').onclick=()=>cur_()&&$('#f-cover2').click();
$('#f-cover2').onchange=async e=>{const f=e.target.files[0],g=cur_();if(!f||!g)return;try{g.cover=new Blob([await f.arrayBuffer()],{type:f.type});await put('games',g)}catch(err){toast('Não foi possível guardar a capa')}e.target.value='';await loadLib()};
$('#b-del').onclick=async()=>{const g=cur_();if(!g||!await ask('Apagar "'+g.name+'" e todos os saves?'))return;
 await del('games',g.id);for(const s of ['auto','1','2','3'])await del('states',g.id+':'+s);await loadLib()};

const keys={up:()=>{sel=Math.max(0,sel-1);render()},down:()=>{sel=Math.min(games.length-1,sel+1);render()},
 a:()=>cur_()&&launch(cur_().id,false),start:openAdd,select:()=>cur_()&&$('#f-cover2').click(),
 b:()=>document.querySelectorAll('.ov.show').forEach(o=>o.classList.remove('show')),left:()=>{},right:()=>{}};
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>keys[b.dataset.k]());
document.addEventListener('keydown',e=>{if(document.body.classList.contains('playing')||e.target.tagName==='INPUT')return;
 const m={ArrowUp:'up',ArrowDown:'down',Enter:'a',Escape:'b'}[e.key];m&&keys[m]()});

/* ---------- jogando ---------- */
let cur=null,started=false;
async function snap(slot){
 const m=window.EJS_emulator;if(!started||!m||!m.gameManager)return false;
 try{const st=m.gameManager.getState();if(!st||!st.length)return false;
  await put('states',{key:cur+':'+slot,data:new Blob([st]),time:Date.now()});return true}catch(e){return false}}
async function restore(slot){
 const r=await get('states',cur+':'+slot);if(!r)return false;
 try{window.EJS_emulator.gameManager.loadState(new Uint8Array(await r.data.arrayBuffer()));return true}catch(e){return false}}
async function back(){await snap('auto');try{tg.exitFullscreen&&tg.exitFullscreen()}catch(e){}history.replaceState(null,'',location.pathname);location.reload()}

async function startPlay(id,fresh){
 cur=id;document.body.classList.add('playing');
 const g=await get('games',id);if(!g){history.replaceState(null,'',location.pathname);return home()}
 $('#title').textContent=g.name;
 let rom;try{rom=new Blob([await g.rom.arrayBuffer()])}catch(e){
  toast('Não consegui ler a ROM salva. Apague o jogo e adicione de novo.');
  setTimeout(()=>{history.replaceState(null,'',location.pathname);location.reload()},3000);return}
 const auto=fresh?null:await get('states',id+':auto');
 /* usa o emulador hospedado na pasta data/ do próprio site; se ela não existir, cai no CDN */
 let base='https://cdn.emulatorjs.org/stable/data/';
 try{const r=await fetch('data/loader.js',{method:'HEAD',cache:'no-store'});if(r.ok)base='data/'}catch(e){}
 toast(base==='data/'?'Emulador local ✓':'Emulador via CDN');
 Object.assign(window,{EJS_player:'#game',EJS_core:'gba',EJS_gameUrl:URL.createObjectURL(rom),
  EJS_gameName:g.name.replace(/[^\w\- ]/g,'')||'jogo',EJS_pathtodata:base,
  EJS_color:'#7b4fd6',EJS_language:'pt-BR',EJS_threads:false,EJS_defaultOptions:{'virtual-gamepad':'disabled'},
  EJS_onGameStart:()=>{started=true;toast(auto?'Auto-save carregado':'Auto-save ativo')}});
 if(auto)window.EJS_loadStateURL=URL.createObjectURL(auto.data);
 try{tg.requestFullscreen&&tg.requestFullscreen()}catch(e){}
 try{tg.BackButton.show();tg.BackButton.onClick(back)}catch(e){}
 setInterval(()=>snap('auto'),30000);
 document.addEventListener('visibilitychange',()=>document.hidden&&snap('auto'));
 addEventListener('pagehide',()=>snap('auto'));
 const s=document.createElement('script');s.src=EJS_pathtodata+'loader.js';
 s.onerror=()=>toast('Não foi possível carregar o emulador');document.body.appendChild(s);
}
$('#p-back').onclick=back;
const vibLabel=()=>$('#s-vib').textContent='Vibração: '+(vibOn?'ligada':'desligada');
$('#s-vib').onclick=()=>{vibOn=!vibOn;try{localStorage.setItem('vib',vibOn?'1':'0')}catch(e){}vibLabel();buzz('medium')};
vibLabel();
$('#s-close').onclick=()=>$('#ov-saves').classList.remove('show');
$('#p-saves').onclick=async()=>{
 const box=$('#slots');box.innerHTML='';box.style.cssText='display:flex;flex-direction:column;gap:8px';
 for(const s of ['auto','1','2','3']){
  const r=await get('states',cur+':'+s),row=document.createElement('div');row.className='slot';
  row.innerHTML='<div><b>'+(s==='auto'?'Auto-save':'Slot '+s)+'</b><small>'+(r?fmt(r.time):'vazio')+'</small></div>';
  if(s!=='auto'){const sv=document.createElement('button');sv.textContent='Salvar';
   sv.onclick=async()=>{toast(await snap(s)?'Salvo no slot '+s:'Não foi possível salvar');$('#p-saves').click()};row.appendChild(sv)}
  const ld=document.createElement('button');ld.textContent='Carregar';ld.disabled=!r;
  ld.onclick=async()=>{if(await restore(s)){$('#ov-saves').classList.remove('show');toast('Save carregado')}else toast('Falha ao carregar')};
  row.appendChild(ld);box.appendChild(row)}
 $('#ov-saves').classList.add('show')};

/* ---------- controles do console ---------- */
const press=(i,v)=>{try{window.EJS_emulator.gameManager.simulateInput(0,i,v)}catch(e){}};
document.querySelectorAll('#pc .pb').forEach(b=>{
 const i=+b.dataset.i,up=()=>{b.classList.remove('on');press(i,0)};
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}b.classList.add('on');press(i,1);buzz('light')});
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,up));
});
const dp=$('#dp'),dirs={4:0,5:0,6:0,7:0},arrow={4:'u',5:'bt',6:'l',7:'r'};
function setDir(x,y){
 const r=dp.getBoundingClientRect(),dx=(x-r.left-r.width/2)/(r.width/2),dy=(y-r.top-r.height/2)/(r.height/2);
 const n={4:dy<-.3?1:0,5:dy>.3?1:0,6:dx<-.3?1:0,7:dx>.3?1:0};
 for(const k in n)if(n[k]!==dirs[k]){dirs[k]=n[k];press(+k,n[k]);dp.querySelector('.ar.'+arrow[k]).classList.toggle('on',!!n[k]);if(n[k])buzz('light')}}
const freeDir=()=>{for(const k in dirs)if(dirs[k]){dirs[k]=0;press(+k,0);dp.querySelector('.ar.'+arrow[k]).classList.remove('on')}};
dp.addEventListener('pointerdown',e=>{e.preventDefault();try{dp.setPointerCapture(e.pointerId)}catch(x){}setDir(e.clientX,e.clientY)});
dp.addEventListener('pointermove',e=>{if(dp.hasPointerCapture&&dp.hasPointerCapture(e.pointerId))setDir(e.clientX,e.clientY)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dp.addEventListener(t,freeDir));

/* Ajustes: abre o menu do emulador numa tela maior e volta ao console */
const lcd=$('#lcdwrap'),resize=()=>setTimeout(()=>dispatchEvent(new Event('resize')),60);
$('#p-set').onclick=()=>{
 const em=window.EJS_emulator;if(!started||!em)return toast('Aguarde o jogo iniciar');
 lcd.classList.add('big');resize();
 try{em.menu.open(true)}catch(e){}
 setTimeout(()=>{try{em.elements.bottomBar.settings[0][0].click()}catch(e){}},300)};
$('#p-close').onclick=()=>{
 const em=window.EJS_emulator;
 try{em.closeSettingsMenu&&em.closeSettingsMenu()}catch(e){}
 try{em.menu.close()}catch(e){}
 lcd.classList.remove('big');resize()};

/* ---------- início ---------- */
function home(){try{tg.BackButton.hide()}catch(e){}try{if(tg.isFullscreen)tg.exitFullscreen()}catch(e){}loadLib()}
const m=location.hash.match(/^#play=([^&]+)(&fresh)?$/);
m?startPlay(decodeURIComponent(m[1]),!!m[2]):home();
</script>
</body>
